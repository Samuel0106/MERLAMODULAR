name: Deploy to Heroku with OpenAI API Key

on:
  push:
    branches:
      - MerlaA_Sam  # Esta es la rama que mencionaste

jobs:
  deploy:
    runs-on: ubuntu-latest  # Usamos un runner de Ubuntu para este flujo de trabajo

    steps:
    - name: Checkout code
      uses: actions/checkout@v2  # Esta acción obtiene tu código desde el repositorio

    - name: Set up PHP
      uses: shivammathur/setup-php@v2  # Configura el entorno PHP para el proyecto Laravel
      with:
        php-version: '7.4'  # Asegúrate de usar la versión correcta de PHP para tu proyecto
        extensions: mbstring, bcmath, exif, gd, zip  # Extensiones comunes de PHP para Laravel

    - name: Install dependencies
      run: |
        composer install --no-progress --no-suggest --prefer-dist  # Instala las dependencias de Laravel

    - name: Set up Heroku API Key and Deploy
      env:
        HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}  # La API Key de Heroku que debes agregar en Secrets de GitHub
      run: |
        echo "Deploying to Heroku..."
        git remote add heroku https://git.heroku.com/your-heroku-app.git  # Asegúrate de usar la URL correcta de tu app en Heroku
        git push heroku MerlaA_Sam:master  # Empuja los cambios a Heroku

    - name: Set OpenAI API Key on Heroku
      run: |
        heroku config:set OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} --app your-heroku-app  # Configura la clave de OpenAI en Heroku
