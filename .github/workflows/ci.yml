name: CI Workflow

on:
  push:
    branches:
      - main  # O la rama principal que desees, puede ser 'master' o cualquier otra

jobs:
  build:
    runs-on: ubuntu-latest  # Puedes cambiar a otro sistema operativo si lo necesitas

    steps:
    - name: Checkout code
      uses: actions/checkout@v2  # Esto descargará tu código del repositorio

    - name: Set up OpenAI API key
      run: |
        echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> $GITHUB_ENV  # Establece la API key desde los secrets

    - name: Run your script or code
      run: |
        # Aquí puedes correr el script o el código que usa la clave API
        echo "The OpenAI API Key is set and ready to use"
        curl -X POST -H "Authorization: Bearer $OPENAI_API_KEY" https://api.openai.com/v1/completions
